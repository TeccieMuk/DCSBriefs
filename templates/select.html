<!DOCTYPE html>
<html>
<head>
    <title>Mission Flights</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Mission Briefing</h1>

    <h2>Situation</h2>
    <p>{{ data.situation | replace('\n', '<br>') | safe }}</p>

    <h2>Blue Task</h2>
    <p>{{ data.blue_coalition.task | replace('\n', '<br>') | safe }}</p>

<h2>Flights</h2>
<div id="flightList">
    {% for flight in data.blue_coalition.flights %}
    <div class="flight-item">
        <input type="radio" name="flightSelect" id="flight{{ loop.index0 }}" 
               data-index="{{ loop.index0 }}" onchange="showPreview(this)">
        <label for="flight{{ loop.index0 }}">{{ flight.group_name }} ({{ flight.units[0].type }})</label>
    </div>
    {% endfor %}
    <button id="savePngsBtn">Save PNGs</button>
</div>

<div id="previews"></div>

<script>
const data = {{ data|tojson }};  // Make sure this includes lat/lon
console.log(data)
console.log(data.blue_coalition.flights);
const start_epoch = data.start_epoch;
let currentPreview = null;
const nmToMeters = 1852;
let currentMap = null;

// UI
document.getElementById("savePngsBtn").addEventListener("click", async () => {
    const kneeboardEl = document.querySelector(".kneeboard");
    if (!kneeboardEl) {
        alert("Kneeboard not found!");
        return;
    }

    const targetWidth = 1358;
    const targetHeight = 2048;

    // ===== Helper to render kneeboard =====
    async function captureElement(el) {
        const canvas = await html2canvas(el, {
            backgroundColor: "#fff",
            scale: 2,
            useCORS: true,
            allowTaint: true
        });

        const outCanvas = document.createElement("canvas");
        outCanvas.width = targetWidth;
        outCanvas.height = targetHeight;
        const ctx = outCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

        return outCanvas.toDataURL("image/png");
    }

    // ===== Helper to render map at exact output size =====
    async function renderMapPNG(flightMapData, bullseye) {
        return new Promise((resolve) => {
            // Offscreen container
            const offscreen = document.createElement("div");
            offscreen.style.width = targetWidth + "px";
            offscreen.style.height = targetHeight + "px";
            offscreen.style.position = "absolute";
            offscreen.style.top = "-9999px";
            document.body.appendChild(offscreen);

            // Create Leaflet map
            const map = L.map(offscreen, {
                center: [bullseye.lat, bullseye.lon],
                zoom: 10,
                attributionControl: false,
                zoomControl: false
            });

            // Add tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                crossOrigin: true
            }).addTo(map);

            // Add your polylines / markers from flightMapData
            flightMapData.polylines.forEach(line => {
                L.polyline(line.latlngs, { color: line.color, weight: line.weight }).addTo(map);
            });
            flightMapData.markers.forEach(marker => {
                L.marker([marker.lat, marker.lon]).addTo(map);
            });

            // Wait for tiles to load
            map.whenReady(() => {
                html2canvas(offscreen, { backgroundColor: "#fff", scale: 2 }).then(canvas => {
                    const outCanvas = document.createElement("canvas");
                    outCanvas.width = targetWidth;
                    outCanvas.height = targetHeight;
                    const ctx = outCanvas.getContext("2d");
                    ctx.drawImage(canvas, 0, 0, targetWidth, targetHeight);
                    document.body.removeChild(offscreen);
                    resolve(outCanvas.toDataURL("image/png"));
                });
            });
        });
    }

    // ===== Helper to save =====
    function saveDataURL(dataURL, filename) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = dataURL;
        link.click();
    }

    try {
        // 1) Render map
        const mapDataURL = await renderMapPNG(dataForExportMap, data.blue_coalition.bullseye);
        saveDataURL(mapDataURL, "map.png");

        // 2) Render kneeboard
        const kneeboardDataURL = await captureElement(kneeboardEl);
        saveDataURL(kneeboardDataURL, "kneeboard.png");

        alert("PNG export complete!");
    } catch (err) {
        console.error(err);
        alert("Failed to export PNGs: " + err);
    }
});

// =====================
// Format absolute time
// =====================
function formatTime(epochSeconds) {
    const date = new Date(epochSeconds * 1000);
    return date.toISOString().substr(11, 8); // HH:MM:SS
}

// =====================
// Flight Map
// =====================
function createFlightMap(flight, bullseye_latlon, mapId) {
    const maxRangeBullseye = 100;
    const defaultPadding = 1.1;

    const bounds = L.latLngBounds(
        computeDestinationPoint(bullseye_latlon, maxRangeBullseye * defaultPadding, 225), // SW corner
        computeDestinationPoint(bullseye_latlon, maxRangeBullseye * defaultPadding, 45)   // NE corner
    );

    const map = L.map(mapId);
    currentMap = map;
    map.fitBounds(bounds);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © OpenStreetMap contributors'
    }).addTo(map);

    // Draw flight path
    const coords = flight.waypoints.map(wp => [wp.lat, wp.lon]);
    L.polyline(coords, {color: 'red'}).addTo(map);

    // Draw segments, midpoint labels, waypoint circles & numbers
    map.createPane('labels');  // for waypoint number labels
    map.getPane('labels').style.zIndex = 650;

    for (let i = 1; i < flight.waypoints.length; i++) {
        const wp1 = flight.waypoints[i-1];
        const wp2 = flight.waypoints[i];
        const latlngs = [[wp1.lat, wp1.lon],[wp2.lat, wp2.lon]];
        L.polyline(latlngs, {color: 'blue'}).addTo(map);

        // midpoint label
        const midLat = (wp1.lat + wp2.lat)/2;
        const midLon = (wp1.lon + wp2.lon)/2;
        L.marker([midLat, midLon], {
            icon: L.divIcon({
                className: 'segment-label',
                html: `<div style="font-weight:bold;color:black;text-align:center;">${wp2.dist.toFixed(1)}<br>${wp2.head.toFixed(0)}°</div>`,
                iconSize: [60,30]
            })
        }).addTo(map);

        // circles & numbers
        L.circle([wp1.lat, wp1.lon], {radius:750, color:'blue', fillColor:'blue', fillOpacity:1}).addTo(map);
        L.marker([wp2.lat, wp2.lon], {
            icon: L.divIcon({
                className:'wp-label',
                html:`<div style="font-weight:bold;color:white;text-align:center;">${i+1}</div>`,
                iconSize:[20,20], iconAnchor:[10,10]
            }),
            pane:'labels'
        }).addTo(map);
    }

    // Bullseye range rings & radials
    for (let r=20; r<=maxRangeBullseye; r+=20) {
        L.circle(bullseye_latlon, {radius:r*nmToMeters,color:'red',fill:false,dashArray:'4,4'}).addTo(map);
        // label north radial
        const labelPoint = computeDestinationPoint(bullseye_latlon, r, 0);
        L.marker(labelPoint, {icon:L.divIcon({className:'range-label', html:`<div style="color:red;font-size:12px;font-weight:bold;">${r}</div>`, iconSize:[20,20], iconAnchor:[10,10]})}).addTo(map);
    }
    for(let angle=0;angle<360;angle+=45){
        const dest = computeDestinationPoint(bullseye_latlon, maxRangeBullseye, angle);
        L.polyline([bullseye_latlon,dest],{color:'red',weight:1,dashArray:'2,6'}).addTo(map);
    }

    return map;
}

// =====================
// Waypoint Table
// =====================
function createWaypointTable(flight) {
    let tableHtml = `<table class="kneeboard-table">
        <thead>
            <tr>
                <th colspan="7" class="section-header">Waypoint Table</th>
            </tr>
            <tr>
                <th>#</th><th>Desc</th><th>Time</th>
                <th>Dist (nm)</th><th>Head (°)</th><th>Speed</th><th>Alt</th>
            </tr>
        </thead><tbody>`;

    let prev = null;
    flight.waypoints.forEach((wp, i) => {
        let dist = 0, head = 0;
        if (prev) {
            const dx = wp.lon - prev.lon;
            const dy = wp.lat - prev.lat;
            dist = Math.sqrt(dx*dx + dy*dy) * 60; // rough nm
            head = Math.atan2(dx, dy) * 180 / Math.PI;
            if (head < 0) head += 360;
        }
        const absEpoch = start_epoch + wp.time;
        const absTime = formatTime(absEpoch);

        tableHtml += `<tr>
            <td>${i+1}</td>
            <td>${wp.name || 'WP'+(i+1)}</td>
            <td>${absTime}</td>
            <td>${dist.toFixed(1)}</td>
            <td>${head.toFixed(0)}</td>
            <td>${wp.speed.toFixed(0)}</td>
            <td>${wp.alt.toFixed(0)}</td>
        </tr>`;

        prev = wp;
    });

    tableHtml += `</tbody></table>`;
    return tableHtml;
}

// =====================
// Radio Table
// =====================

function renderCommLadder(flight, allFlights, ships) {
    const mainRadios = flight.units[0].radios || [];
    const numRadios = mainRadios.length;
    const nrColumns = numRadios + 3;
    let tableHtml = `<table class="kneeboard-table">
        <thead>
            <tr>
                <th colspan="${nrColumns}}" class="section-header">Comm Ladder</th>
            </tr>
            <tr>
                <th>Agency</th>
                <th>Callsign</th>`;
    for (let i = 0; i < numRadios; i++) {
        tableHtml += `<th>Radio ${i+1}</th>`;
    }
    tableHtml += `<th>TACAN</th></tr></thead><tbody>`;

    function matchingChannel(radio, freq) {
        if (!radio || !radio.channels) return '';
        const idx = radio.channels.findIndex(c => c === freq);
        return idx !== -1 ? `${freq.toFixed(3)} [${idx+1}]` : '';
    }

    function renderFlightRow(main_flight, rowFlight, tacan_channels, label) {
        console.log(rowFlight)
        let row = `<tr><td>${label}</td><td>${rowFlight.name}</td>`;
        for (let i = 0; i < numRadios; i++) {
            const radio = main_flight.units[0].radios?.[i];
            row += `<td>${matchingChannel(radio, rowFlight.frequency)}</td>`;
        }
        row += `<td>${tacan_channels?.map(tc => tc.channel + tc.mode).join(', ') || '-'}</td>`;
        row += `</tr>`;
        return row;
    }

    // Intra flight
    tableHtml += renderFlightRow(flight, flight, [], 'Intra-Flight');

    // ATC
    if ("linked_takeoff_unit" in flight){
        const linked_ship_id = flight.linked_takeoff_unit;
        const ships_units = ships.flatMap(f => f.units || []);
        linked_ship = ships_units.find(f => f.unit_id == linked_ship_id);
        if (linked_ship) tableHtml += renderFlightRow(flight, linked_ship, linked_ship.tacan_channels, 'ATC');
    }

    // Tactical
    const awacsFlight = allFlights.find(f => f.is_awacs);
    if (awacsFlight) tableHtml += renderFlightRow(flight, awacsFlight, [], 'Tactical');

    // Tanker
    const tankerFlight = allFlights.find(f => f.is_tanker);
    if (tankerFlight) tableHtml += renderFlightRow(flight, tankerFlight, tankerFlight.units[0].tacan_channels, 'Tanker');

    tableHtml += `</tbody></table>`;
    return tableHtml;
}


// =====================
// Show Preview
// =====================
function showPreview(radioInput){
    const flights = data.blue_coalition.flights;
    const ships = data.blue_coalition.ships;
    const index = parseInt(radioInput.dataset.index);
    const flight = flights[index];
    const container = document.getElementById("previews");

    if(currentPreview) { currentPreview.remove(); currentPreview=null; }

    const div = document.createElement('div'); div.className='preview';
    div.innerHTML = `
        <div class="layout">
            <div class="map-container">
                <div id="map${index}" class="map"></div>
            </div>
            <div class="side-panel">
                <div class="kneeboard">
                    <div class="kneeboard-section">
                        ${createWaypointTable(flight)}
                    </div>
                    <div class="kneeboard-section">
                        ${renderCommLadder(flight, flights, ships)}
                    </div>
                </div>
            </div>
            </div>
    `;

    container.appendChild(div);
    currentPreview = div;

    const bullseye = data.blue_coalition.bullseye;
    let bullseye_latlon = L.latLng(bullseye.lat, bullseye.lon);
    createFlightMap(flight, bullseye_latlon, `map${index}`);
}

// =====================
// Util
// =====================
function computeDestinationPoint(latlng, distanceNm, bearingDeg) {
    const lat = latlng.lat;
    const lon = latlng.lng;
    const R = 6371e3; // earth radius in meters
    const dist = distanceNm * 1852; // convert nm → m
    const brng = bearingDeg * Math.PI / 180;

    const φ1 = lat * Math.PI / 180;
    const λ1 = lon * Math.PI / 180;

    const φ2 = Math.asin(
        Math.sin(φ1) * Math.cos(dist / R) +
        Math.cos(φ1) * Math.sin(dist / R) * Math.cos(brng)
    );
    const λ2 = λ1 + Math.atan2(
        Math.sin(brng) * Math.sin(dist / R) * Math.cos(φ1),
        Math.cos(dist / R) - Math.sin(φ1) * Math.sin(φ2)
    );

    return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
}
